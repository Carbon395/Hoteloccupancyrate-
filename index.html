<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市旅館訂房填報系統</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f3966 0%, #1a4f8a 100%);
            --btn-hover-gradient: linear-gradient(135deg, #164980 0%, #225fa3 100%);
            --background-color: #f6f3ea;    /* 高級溫潤的溫泉淺米黃 */
            --card-bg: #ffffff;
            --text-main: #1e2022;           /* 高級深炭黑 */
            --text-muted: #555b61;          /* 強化加深霧灰 */
            --border-normal: #cbc4b7;       /* 稍微加深的優雅暖灰邊框 */
            --border-focus: #1a4f8a;
            --focus-glow: rgba(26, 79, 138, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--background-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* 系統核心卡片 */
        .system-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 680px; 
            padding: 50px 45px;
            border-radius: 20px;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.01),
                0 25px 50px -12px rgba(163, 154, 134, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(213, 207, 196, 0.7);
            position: relative;
        }

        .system-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px; 
            background: var(--primary-gradient);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .system-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .system-header h2 {
            color: #0f3966;
            font-size: 30px; 
            font-weight: 900; 
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 32px; 
        }

        /* 欄位標籤：加大且極粗體 */
        label {
            display: block;
            font-weight: 800;
            margin-bottom: 12px;
            font-size: 20px; 
            color: var(--text-main);
            letter-spacing: 0.8px;
        }

        /* 💡 核心變更：輸入項目填入的文字「放巨大」，提升辨識度 */
        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 18px 20px; 
            font-size: 28px;        /* 文字調為巨大 28px */
            font-weight: 900;       /* 文字粗度調為極粗 900 */
            color: var(--text-main);
            border: 3px solid var(--border-normal); 
            border-radius: 14px;
            background-color: #fcfcfb;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            box-shadow: inset 0 2px 5px rgba(163, 154, 134, 0.15);
        }

        /* 提示字（Placeholder）稍微縮小一些，以防文字過長溢出，但仍保持清晰粗體 */
        ::-webkit-input-placeholder { font-weight: 700; font-size: 20px; color: #a0a5ab; }
        :-moz-placeholder { font-weight: 700; font-size: 20px; color: #a0a5ab; }
        ::-moz-placeholder { font-weight: 700; font-size: 20px; color: #a0a5ab; }
        :-ms-input-placeholder { font-weight: 700; font-size: 20px; color: #a0a5ab; }

        /* 下拉選單高級箭頭（配合巨大文字放大與向右微調） */
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%231e2022' stroke-linecap='round' stroke-linejoin='round' stroke-width='2.5' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 22px center;
            background-size: 20px 20px;
            padding-right: 56px;
        }

        /* 聚焦時的亮化與立體藍光暈 */
        input:focus, select:focus {
            border-color: var(--border-focus);
            background-color: #ffffff;
            box-shadow: 
                0 0 0 5px var(--focus-glow),
                inset 0 1px 2px rgba(0, 0, 0, 0.01);
        }

        /* 行事曆點選圖示放大 */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            scale: 1.5; 
            opacity: 0.8;
            margin-right: 5px;
            transition: opacity 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .hint-text {
            font-size: 16px;
            font-weight: 800; 
            color: #d1413b;  /* 深警示紅 */
            text-align: center;
            margin-top: 26px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        /* 大氣微立體按鈕 */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 18px; 
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 22px; 
            font-weight: 800; 
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 6px 18px rgba(26, 79, 138, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: var(--btn-hover-gradient);
            box-shadow: 0 8px 24px rgba(26, 79, 138, 0.45);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
            box-shadow: 0 4px 12px rgba(26, 79, 138, 0.45);
        }

        /* 頁尾版權 */
        .system-footer {
            margin-top: 45px;
            padding-top: 26px;
            border-top: 1px solid #edeae1;
            font-size: 14px;
            font-weight: 700; 
            color: #9a9486;
            text-align: center;
            letter-spacing: 0.8px;
        }

        @media (min-width: 576px) {
            body {
                padding: 60px 20px;
            }
            .system-card {
                padding: 55px 55px;
            }
        }
    </style>
</head>
<body>

<div class="system-card">
    <div class="system-header">
        <h2>臺北市旅館訂房填報系統</h2>
    </div>
    
    <!-- ⚠️ 請將 ACTION_URL 替換為您的 Google Form formResponse 網址 -->
    <form id="occupancyForm" action="https://docs.google.com/forms/d/e/1FAIpQLScFsx6dMiEBPTR36H5mxF_M2YqirMzbDbtGKs6zXOA6WUwmZw/formResponse" method="POST" target="hidden_iframe">
        
        <!-- 第一列：旅館名稱 -->
        <div class="form-group">
            <label for="hotelName">旅館名稱</label>
            <!-- ⚠️ 請將 entry.111111 替換為對應的 Google Form Entry ID -->
            <input type="text" id="hotelName" name="entry.1785275569" required placeholder="請輸入旅館完整名稱">
        </div>

        <!-- 第二列：行政區 -->
        <div class="form-group">
            <label for="district">行政區</label>
            <!-- ⚠️ 請將 entry.222222 替換為對應的 Google Form Entry ID -->
            <select id="district" name="entry.1640318744" required>
                <option value="" disabled selected>請選擇行政區</option>
                <option value="中正區">中正區</option>
                <option value="萬華區">萬華區</option>
                <option value="大同區">大同區</option>
                <option value="中山區">中山區</option>
                <option value="大安區">大安區</option>
                <option value="信義區">信義區</option>
                <option value="松山區">松山區</option>
                <option value="內湖區">內湖區</option>
                <option value="南港區">南港區</option>
                <option value="士林區">士林區</option>
                <option value="北投區">北投區</option>
                <option value="文山區">文山區</option>
            </select>
        </div>

        <!-- 第三列：訂房率日期 -->
        <div class="form-group">
            <label for="reportDate">訂房率日期</label>
            <!-- ⚠️ 請將 entry.333333 替換為對應的 Google Form Entry ID -->
            <input type="date" id="reportDate" name="entry.202114952" required>
        </div>

        <!-- 第四列：訂房率 -->
        <div class="form-group">
            <label for="occupancyRate">訂房率 (%)</label>
            <div class="input-wrapper">
                <!-- ⚠️ 請將 entry.444444 替換為對應的 Google Form Entry ID -->
                <input type="text" id="occupancyRate" name="entry.2026568636" inputmode="decimal" required placeholder="例如：85.80" oninput="validateRate(this)" onblur="formatOnBlur(this)">
            </div>
        </div>

        <div class="hint-text">建議使用 Chrome 瀏覽器開啟填報</div>

        <button type="submit" class="btn-submit">確認送出填報</button>
    </form>

    <div class="system-footer">
        © 臺北市政府觀光傳播局 版權所有
    </div>
</div>

<!-- 用於處理非跳轉傳送的隱藏 iframe -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    // 自動初始化為填報當日日期
    document.getElementById('reportDate').valueAsDate = new Date();

    // 1. 即時字元過濾與長度攔截
    function validateRate(input) {
        input.value = input.value.replace(/[^0-9.]/g, '');
        
        var parts = input.value.split('.');
        if (parts.length > 2) {
            input.value = parts[0] + '.' + parts.slice(1).join('');
            return;
        }

        if (parts.length === 2 && parts[1].length > 2) {
            input.value = parts[0] + '.' + parts[1].substring(0, 2);
        }
        
        var num = parseFloat(input.value);
        if (!isNaN(num) && num > 100) {
            input.value = '100'; 
            alert('【系統提示】訂房率數值最高僅能填報 100%');
        }
    }

    // 2. 當使用者離開輸入框時，自動補齊小數點後兩位
    function formatOnBlur(input) {
        var val = input.value.trim();
        if (val === '') return;
        
        var num = parseFloat(val);
        if (!isNaN(num) && num >= 0 && num <= 100) {
            input.value = num.toFixed(2);
        }
    }

    // 3. 傳送前表單最後安全驗證與「二次確認彈出視窗」
    document.getElementById('occupancyForm').addEventListener('submit', function(e) {
        var hotelName = document.getElementById('hotelName').value.trim();
        var district = document.getElementById('district').value;
        var reportDate = document.getElementById('reportDate').value;
        var rateInput = document.getElementById('occupancyRate');
        var val = rateInput.value.trim();
        
        var num = parseFloat(val);
        
        // 數值合法性終端檢查
        if (isNaN(num) || num < 0 || num > 100) {
            alert('請填寫正確的訂房率區間值（0 至 100 之間的數值）');
            e.preventDefault();
            return false;
        }
        
        // 強制鎖定最終數值帶有兩位小數
        var finalRate = num.toFixed(2);
        rateInput.value = finalRate;
        
        var confirmMessage = 
            '【 請再次確認填報資料是否正確 】\n' +
            '----------------------------------------\n\n' +
            ' 旅館名稱：' + hotelName + '\n\n' +
            ' 行政區：' + district + '\n\n' +
            ' 訂房率日期：' + reportDate + '\n\n' +
            ' 訂房率 (%)：' + finalRate + ' %\n\n' +
            '----------------------------------------\n' +
            '確認資料無誤並送出請點擊「確定」，欲修改請點擊「取消」。';
            
        if (!confirm(confirmMessage)) {
            e.preventDefault();
            return false;
        }
        
        setTimeout(function() {
            alert('【填報成功】資料已安全傳送至後端管理系統。');
        }, 500);
    });
</script>

</body>
</html>
