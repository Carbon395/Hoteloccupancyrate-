<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市旅館訂房率系統</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input[type="text"], input[type="date"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; background-color: #fff; }
        button[type="submit"] { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button[type="submit"]:hover { background-color: #155cb0; }
    </style>
</head>
<body>

<div class="container">
    <h2>臺北市旅館訂房率填報系統</h2>

    <!-- 移除 action, target，改由 JS 全權穩定處理 -->
    <form id="occupancyForm">
        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
                <label for="district">行政區</label>
                <select id="district" name="entry.1640318744" required>
                    <option value="" disabled selected>-- 請選擇 --</option>
                    <option value="中正區">中正區</option><option value="萬華區">萬華區</option>
                    <option value="大同區">大同區</option><option value="中山區">中山區</option>
                    <option value="大安區">大安區</option><option value="信義區">信義區</option>
                    <option value="松山區">松山區</option><option value="內湖區">內湖區</option>
                    <option value="南港區">南港區</option><option value="士林區">士林區</option>
                    <option value="北投區">北投區</option><option value="文山區">文山區</option>
                </select>
            </div>
            <div class="form-group" style="flex: 2;">
                <label for="hotelName">旅館名稱</label>
                <input type="text" id="hotelName" name="entry.1785275569" required placeholder="例如：大安精品旅店">
            </div>
        </div>
        
        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
                <label for="reportDate">訂房率日期</label>
                <input type="date" id="reportDate" name="entry.202114952" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="occupancyRate">訂房率</label>
                <input type="number" id="occupancyRate" name="entry.2026568636" min="0" max="100" required placeholder="請填數字 0 - 100，勿填 %">
            </div>
        </div>
        
        <button type="submit">提交填報資料</button>
    </form>
</div>

<script>
    // 預設填報日期為今天
    document.getElementById('reportDate').valueAsDate = new Date();

    const form = document.getElementById('occupancyForm');
    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScFsx6dMiEBPTR36H5mxF_M2YqirMzbDbtGKs6zXOA6WUwmZw/formResponse";

    form.addEventListener('submit', function(e) {
        e.preventDefault(); 

        const district = document.getElementById('district').value;
        const hotelName = document.getElementById('hotelName').value;
        const reportDate = document.getElementById('reportDate').value;
        
        // 防呆過濾 %
        let rateInput = document.getElementById('occupancyRate');
        let occupancyRate = rateInput.value.replace(/[^0-9.]/g, ''); 
        rateInput.value = occupancyRate; 

        const confirmMessage = `請確認您的填報資訊：\n\n行政區：${district}\n旅館名稱：${hotelName}\n訂房率日期：${reportDate}\n訂房率：${occupancyRate}\n\n確定要提交這些資料至雲端後台嗎？`;
        
        if (!confirm(confirmMessage)) {
            return; 
        }

        // 使用 FormData 自動封裝表單內所有帶有 name 的欄位與資料
        const formData = new FormData(form);

        // 使用 fetch 進行非同步 POST 提交，mode 設為 no-cors 允許跨網域寫入
        fetch(GOOGLE_FORM_URL, {
            method: 'POST',
            body: formData,
            mode: 'no-cors' 
        })
        .then(() => {
            // 提交成功後的處理
            alert('訂房率已成功同步至觀傳局系統後台！');
            form.reset();
            document.getElementById('reportDate').valueAsDate = new Date(); // 重新預設今天
        })
        .catch((error) => {
            console.error('提交失敗:', error);
            alert('系統提交時發生未預期錯誤，請聯絡系統管理員。');
        });
    });
</script>

</body>
</html>
