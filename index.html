<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>臺北市旅館訂房填報系統</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f3966 0%, #1a4f8a 100%);
            --btn-hover-gradient: linear-gradient(135deg, #164980 0%, #225fa3 100%);
            --background-color: #f6f3ea;    /* 高級溫潤的溫泉淺米黃 */
            --card-bg: #ffffff;
            --text-main: #1e2022;           /* 高級深炭黑 */
            --border-normal: #cbc4b7;       /* 優雅暖灰邊框 */
            --border-focus: #1a4f8a;
            --focus-glow: rgba(26, 79, 138, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 鎖定手機視窗高度，無論直橫向都絕對禁止出現網頁主捲動條 */
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--background-color);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            padding: 2vh 2vw;
            display: flex;
            justify-content: center;
            align-items: center; 
            -webkit-font-smoothing: antialiased;
            transition: padding 0.3s ease;
        }

        /* ==========================================================================
           【預設模式：直幅螢幕 (Portrait)】完美契合手機直拿 9:16 視覺
           ========================================================================== */
        .system-card {
            background: var(--card-bg);
            width: calc(92vh * 9 / 16); 
            max-width: 100%;
            height: 92vh; 
            max-height: 740px;
            padding: 3vh 5vw;
            border-radius: 16px;
            box-shadow: 0 12px 32px -12 rgba(163, 154, 134, 0.35);
            border: 1px solid rgba(213, 207, 196, 0.5);
            position: relative;
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        /* 頂部藍色質感裝飾條 */
        .system-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px; 
            background: var(--primary-gradient);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .system-header {
            text-align: center;
            margin-top: 1vh;
            margin-bottom: 1vh;
            flex-shrink: 0;
        }

        .system-header h2 {
            color: #0f3966;
            font-size: clamp(20px, 3vh, 26px); /* 📌 標題放大 */
            font-weight: 800; 
            letter-spacing: 0.5px;
        }

        form {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        /* 直幅下欄位一行一個 */
        .form-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(8px, 1.8vh, 16px); 
            margin-bottom: 2vh;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.5vh;
            font-size: clamp(14px, 2.2vh, 18px); /* 📌 欄位標籤字體放大 (原 12px~15px) */
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        /* 輸入框尺寸自適應隨手機大小縮放 */
        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: clamp(12px, 1.6vh, 16px) 14px; /* 📌 增加上下內襯讓大字體不擁擠 */
            font-size: clamp(16px, 2.4vh, 20px);    /* 📌 欄位輸入文字放大 (原 14px~17px) */
            font-weight: 600;   
            color: var(--text-main);
            border: 1.5px solid var(--border-normal); 
            border-radius: 8px;
            background-color: #fcfcfb;
            outline: none;
            transition: all 0.15s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        ::-webkit-input-placeholder { font-weight: 500; font-size: 15px; color: #a0a5ab; }

        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23555b61' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px 16px;
            padding-right: 42px;
        }

        input:focus, select:focus {
            border-color: var(--border-focus);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px var(--focus-glow);
        }

        .action-area {
            display: flex;
            flex-direction: column;
            gap: 1vh;
            flex-shrink: 0;
        }

        .hint-text {
            font-size: clamp(12px, 1.8vh, 14px); /* 📌 提示字微調放大 */
            font-weight: 600; 
            color: #d1413b;
            text-align: center;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: clamp(14px, 1.8vh, 18px); 
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: clamp(16px, 2.4vh, 20px); /* 📌 按鈕字體同步放大 */
            font-weight: 700; 
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 14px rgba(26, 79, 138, 0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-submit:active {
            transform: scale(0.98);
            background: var(--btn-hover-gradient);
        }

        .system-footer {
            padding-top: 1vh;
            border-top: 1px solid #edeae1;
            font-size: clamp(11px, 1.5vh, 13px);
            font-weight: 600; 
            color: #9a9486;
            text-align: center;
            flex-shrink: 0;
        }

        /* ==========================================================================
           【橫幅模式：當手機旋轉為橫向時 (Landscape)】自動切換版面配置
           ========================================================================== */
        @media (orientation: landscape) {
            body {
                padding: 2vh 3vw;
            }

            /* 卡片展開為適合橫幅的寬度比例，高度微縮防踩底 */
            .system-card {
                width: calc(92vh * 16 / 9); 
                height: 92vh;
                max-width: 840px;
                max-height: 520px;
                padding: 3vh 4vw 2vh 4vw;
            }

            .system-header {
                margin-top: 0.2vh;
                margin-bottom: 1.2vh;
            }

            .system-header h2 {
                font-size: clamp(20px, 4vh, 24px);
            }

            /* 欄位改為雙欄並排，省下大量垂直高度 */
            .form-content {
                grid-template-columns: 1fr 1fr;
                gap: 1.2vh 2vw;
                margin-bottom: 1.2vh;
            }

            /* 讓第一個欄位（旅館名稱）橫跨兩欄，保有足夠長度 */
            .form-group:first-child {
                grid-column: span 2;
            }

            /* 橫幅下微調輸入框內襯，確保在大字體下不擠壓 */
            input[type="text"],
            input[type="date"],
            select {
                padding: clamp(10px, 2vh, 14px) 12px;
                font-size: clamp(15px, 2.6vh, 18px);
            }

            label {
                margin-bottom: 0.3vh;
                font-size: clamp(13px, 2.2vh, 15px);
            }

            /* 橫向模式下按鈕與提示橫向並排，更省空間 */
            .action-area {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 2vw;
            }

            .hint-text {
                text-align: left;
                margin-top: 0;
                white-space: nowrap;
            }

            .btn-submit {
                width: auto;
                min-width: 180px;
                padding: clamp(12px, 2.4vh, 16px) 24px;
                font-size: clamp(15px, 2.8vh, 18px);
            }

            .system-footer {
                padding-top: 0.6vh;
                margin-top: 0.4vh;
            }
        }

        /* 🚨 小螢幕手機安全防護：若螢幕極度窄小，自動限制避免變形 */
        @media (max-width: 350px) and (orientation: portrait) {
            .system-card {
                width: 96vw;
                height: calc(96vw * 16 / 9);
                padding: 16px 12px;
            }
        }
    </style>
</head>
<body>

<div class="system-card">
    <!-- 頂部標題 -->
    <div class="system-header">
        <h2>臺北市旅館訂房填報系統</h2>
    </div>
    
    <!-- 中部表單區 -->
    <!-- ⚠️ 請將 ACTION_URL 替換為您的 Google Form formResponse 網址 -->
    <form id="occupancyForm" action="https://docs.google.com/forms/d/e/1FAIpQLScFsx6dMiEBPTR36H5mxF_M2YqirMzbDbtGKs6zXOA6WUwmZw/formResponse" method="POST" target="hidden_iframe">
        
        <div class="form-content">
            <!-- 欄位一：旅館名稱 -->
            <div class="form-group">
                <label for="hotelName">旅館名稱</label>
                <!-- ⚠️ 請將 entry.111111 替換為對應的 Google Form Entry ID -->
                <input type="text" id="hotelName" name="entry.1785275569" required placeholder="請輸入完整旅館名稱">
            </div>

            <!-- 欄位二：行政區 -->
            <div class="form-group">
                <label for="district">行政區</label>
                <!-- ⚠️ 請將 entry.222222 替換為對應的 Google Form Entry ID -->
                <select id="district" name="entry.1640318744" required>
                    <option value="" disabled selected>請選擇行政區</option>
                    <option value="中正區">中正區</option>
                    <option value="萬華區">萬華區</option>
                    <option value="大同區">大同區</option>
                    <option value="中山區">中山區</option>
                    <option value="大安區">大安區</option>
                    <option value="信義區">信義區</option>
                    <option value="松山區">松山區</option>
                    <option value="內湖區">內湖區</option>
                    <option value="南港區">南港區</option>
                    <option value="士林區">士林區</option>
                    <option value="北投區">北投區</option>
                    <option value="文山區">文山區</option>
                </select>
            </div>

            <!-- 欄位三：訂房率日期 -->
            <div class="form-group">
                <label for="reportDate">訂房率日期</label>
                <!-- ⚠️ 請將 entry.333333 替換為對應的 Google Form Entry ID -->
                <input type="date" id="reportDate" name="entry.202114952" required>
            </div>

            <!-- 欄位四：訂房率 -->
            <div class="form-group">
                <label for="occupancyRate">訂房率 (%)</label>
                <!-- ⚠️ 請將 entry.444444 替換為對應的 Google Form Entry ID -->
                <input type="text" id="occupancyRate" name="entry.2026568636" inputmode="decimal" required placeholder="例如：85.50" oninput="validateRate(this)" onblur="formatOnBlur(this)">
            </div>
        </div>

        <!-- 底部按鈕操作區 -->
        <div class="action-area">
            <div class="hint-text">💡 建議使用 Chrome 瀏覽器填報</div>
            <button type="submit" class="btn-submit">確認送出填報</button>
        </div>
    </form>

    <!-- 頁尾 -->
    <div class="system-footer">
        © 臺北市政府觀光傳播局 版權所有
    </div>
</div>

<!-- 用於處理非跳轉傳送的隱藏 iframe -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    // 自動初始化為填報當日日期
    document.getElementById('reportDate').valueAsDate = new Date();

    // 1. 即時字元過濾與長度攔截
    function validateRate(input) {
        input.value = input.value.replace(/[^0-9.]/g, '');
        
        var parts = input.value.split('.');
        if (parts.length > 2) {
            input.value = parts[0] + '.' + parts.slice(1).join('');
            return;
        }

        if (parts.length === 2 && parts[1].length > 2) {
            input.value = parts[0] + '.' + parts[1].substring(0, 2);
        }
        
        var num = parseFloat(input.value);
        if (!isNaN(num) && num > 100) {
            input.value = '100'; 
            alert('【系統提示】訂房率數值最高僅能填報 100%');
        }
    }

    // 2. 當使用者離開輸入框時，自動補齊小數點後兩位
    function formatOnBlur(input) {
        var val = input.value.trim();
        if (val === '') return;
        
        var num = parseFloat(val);
        if (!isNaN(num) && num >= 0 && num <= 100) {
            input.value = num.toFixed(2);
        }
    }

    // 3. 傳送前表單最後安全驗證與「二次確認彈出視窗」
    document.getElementById('occupancyForm').addEventListener('submit', function(e) {
        var hotelName = document.getElementById('hotelName').value.trim();
        var district = document.getElementById('district').value;
        var reportDate = document.getElementById('reportDate').value;
        var rateInput = document.getElementById('occupancyRate');
        var val = rateInput.value.trim();
        
        var num = parseFloat(val);
        
        if (isNaN(num) || num < 0 || num > 100) {
            alert('請填寫正確的訂房率區間值（0 至 100 之間的數值）');
            e.preventDefault();
            return false;
        }
        
        var finalRate = num.toFixed(2);
        rateInput.value = finalRate;
        
        var confirmMessage = 
            '【 請再次確認填報資料 】\n' +
            '----------------------------------------\n' +
            '旅館名稱：' + hotelName + '\n' +
            '行政區：' + district + '\n' +
            '訂房率日期：' + reportDate + '\n' +
            '訂房率 (%)：' + finalRate + ' %\n' +
            '----------------------------------------\n' +
            '確認送出請點擊「確定」。';
            
        if (!confirm(confirmMessage)) {
            e.preventDefault();
            return false;
        }
        
        setTimeout(function() {
            alert('【填報成功】資料已安全傳送！');
            document.getElementById('occupancyForm').reset();
            document.getElementById('reportDate').valueAsDate = new Date();
        }, 500);
    });
</script>

</body>
</html>
